name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: umbra
          POSTGRES_PASSWORD: umbra
          POSTGRES_DB: umbra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umbra -d umbra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      UMBRA_TEST_DATABASE_URL: postgres://umbra:umbra@localhost:5432/umbra_test

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client libdbus-1-dev pkg-config

      - name: Create test database
        run: |
          PGPASSWORD=umbra psql -h localhost -U umbra -d umbra -c "CREATE DATABASE umbra_test;"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --all

      - name: Exercise SQLite migration path
        run: cargo test -p umbra-migrations sqlite_

      - name: Exercise PostgreSQL integration path
        run: cargo test -p umbra-server -- --test-threads=1

      - name: Build
        run: cargo build

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build final server image and require strict production doctor
        run: |
          docker build --tag umbra-server:ci --file crates/umbra-server/Dockerfile .
          bash scripts/release/doctor-strict.sh umbra-server:ci
